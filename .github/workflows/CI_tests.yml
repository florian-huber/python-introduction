name: CI Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  basic_checks:
    name: Basic environment and code checks / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Python and uv info
        run: |
          uv --version
          uv run --no-project python --version

      - name: Test code examples
        run: |
          uv run --no-project \
            --with "pytest>=8.4.2,<9" \
            --with numpy \
            --with pandas \
            --with matplotlib \
            --with pytest-codeblocks \
            pytest --codeblocks