name: deploy-book

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-book
  cancel-in-progress: false

jobs:
  deploy-book:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Python and uv info
        run: |
          uv --version
          uv run --no-project python --version

      - name: Build the book
        run: |
          uv run --no-project \
            --with "jupyter-book==1.0.4.post1" \
            --with ipykernel \
            --with numpy \
            --with pandas \
            --with matplotlib \
            jupyter-book build .

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build/html